name: ci

# Checks every pushed branch, so a task branch is checked before it's merged (the team merges locally,
# not always through pull requests). A red run means something to fix before merging: formatting
# (Pint), the test suite on MySQL 8 (what the servers run), known vulnerabilities in the packages
# Tuklas ships (composer audit, npm audit), and the React app's types, lint and build.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tuklas

jobs:
  api:
    name: Laravel (Pint, audit, tests on MySQL)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tuklas_test
          MYSQL_USER: tuklas
          MYSQL_PASSWORD: tuklas
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        # The run's own token lets Composer download from GitHub without hitting the anonymous rate limit (429)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: '8.4' # the servers' version (deploy/setup-server.sh)
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sodium, zip, bcmath
          coverage: none

      - name: Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('tuklas/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (formatting)
        run: vendor/bin/pint --test

      - name: Composer audit (known vulnerabilities)
        run: composer audit --no-dev

      - name: PHPStan / Larastan
        if: hashFiles('tuklas/phpstan.neon') != ''
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests on MySQL 8
        # These override phpunit.xml's SQLite settings (its <env> entries don't replace variables set here)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: tuklas_test
          DB_USERNAME: tuklas
          DB_PASSWORD: tuklas
        # On failure, the end of the output also goes on the run's summary page as an annotation
        run: |
          set -o pipefail
          if ! php artisan test 2>&1 | tee "$RUNNER_TEMP/tests.txt"; then
            { grep -E 'FAILED|Tests:' "$RUNNER_TEMP/tests.txt"; echo; tail -n 60 "$RUNNER_TEMP/tests.txt"; } | sed 's/\x1b\[[0-9;]*m//g' | head -c 3500 > "$RUNNER_TEMP/tail.txt"
            echo "::error title=Tests failed::$(sed 's/%/%25/g' "$RUNNER_TEMP/tail.txt" | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

  client:
    name: React app (audit, types, lint, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuklas/package-lock.json

      - run: npm ci --no-fund

      # Only what ships to browsers. Dev tools (ESLint, Vite) are checked locally with `npm audit`.
      - name: npm audit (production packages)
        run: npm audit --omit=dev --audit-level=moderate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # A backup that has never been restored doesn't count (docs/DEPLOYMENT.md). This backs up a seeded
  # MySQL database and some uploads with deploy/backup.sh, damages both, restores with
  # deploy/restore.sh and checks everything came back.
  backups:
    name: Backup and restore (deploy/backup.sh, restore.sh)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tuklas
          MYSQL_USER: tuklas
          MYSQL_PASSWORD: tuklas
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      # The server's layout (setup-server.sh), with this checkout as the live release
      - name: Paths
        working-directory: .
        run: |
          echo "APP_ROOT=$RUNNER_TEMP/app" >> "$GITHUB_ENV"
          echo "BACKUP_DIR=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, sodium, zip, bcmath
          coverage: none

      - name: Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('tuklas/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: sudo apt-get install -y -q age

      - name: Lay out a server, seed the database, add uploads, make a backup key
        run: |
          mkdir -p "$APP_ROOT/shared/storage/app/private/works"
          ln -s "$GITHUB_WORKSPACE/tuklas" "$APP_ROOT/current"
          cp .env.example "$APP_ROOT/shared/.env"
          ln -sf "$APP_ROOT/shared/.env" .env
          php artisan key:generate
          age-keygen -o "$RUNNER_TEMP/backup-key.txt" 2>/dev/null
          echo "BACKUP_AGE_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/backup-key.txt")" >> "$APP_ROOT/shared/.env"
          php artisan migrate --seed --force
          echo "the original paper" > "$APP_ROOT/shared/storage/app/private/works/paper.pdf"

      - name: Back up
        run: bash deploy/backup.sh

      - name: Damage the database and the uploads
        run: |
          mysql -h 127.0.0.1 -utuklas -ptuklas tuklas -e "DELETE FROM messages; DROP TABLE reports; UPDATE works SET title = 'Vandalised';"
          echo "changed" > "$APP_ROOT/shared/storage/app/private/works/paper.pdf"
          echo "not in the backup" > "$APP_ROOT/shared/storage/app/private/stray.txt"

      - name: Restore
        run: bash deploy/restore.sh "$(ls "$BACKUP_DIR"/tuklas-*.tar.age)" --identity "$RUNNER_TEMP/backup-key.txt" --yes

      - name: Check everything came back
        run: |
          q() { mysql -h 127.0.0.1 -utuklas -ptuklas tuklas -N -e "$1"; }
          test "$(q 'SELECT COUNT(*) FROM messages')" -gt 0
          test "$(q "SELECT COUNT(*) FROM works WHERE title = 'Vandalised'")" -eq 0
          q 'SELECT COUNT(*) FROM reports' > /dev/null
          test "$(cat "$APP_ROOT/shared/storage/app/private/works/paper.pdf")" = "the original paper"
          test ! -e "$APP_ROOT/shared/storage/app/private/stray.txt"
          test ! -e storage/framework/down
          ! php artisan migrate:status --pending | grep -q Pending
          echo "Restored and checked."
