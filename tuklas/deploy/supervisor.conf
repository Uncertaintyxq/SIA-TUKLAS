; Keeps Tuklas's background processes running. setup-server.sh installs it as
; /etc/supervisor/conf.d/tuklas.conf; deploy.sh restarts both after each release.
;   sudo supervisorctl status            what's running
;   sudo supervisorctl restart tuklas:*  restart both

[group:tuklas]
programs=tuklas-queue,tuklas-reverb

; Background jobs (announcement emails and other queued work)
[program:tuklas-queue]
command=/usr/bin/php /var/www/tuklas/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/tuklas/current
user=www-data
umask=002
autostart=true
autorestart=true
startretries=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/tuklas/shared/storage/logs/queue.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; Live updates. Only Nginx reaches it (127.0.0.1); the firewall keeps port 8080 closed anyway.
[program:tuklas-reverb]
command=/usr/bin/php /var/www/tuklas/current/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/tuklas/current
user=www-data
umask=002
autostart=true
autorestart=true
startretries=10
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/tuklas/shared/storage/logs/reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
