#cloud-config
# First boot of the Tuklas staging VM (deploy/azure/create-vm.sh passes this as custom data).
# Only the basics: security updates and a swap file, because a B1s has 1 GB of memory and MySQL,
# PHP-FPM, Reverb and the queue worker need more headroom than that. Installing Nginx, PHP, MySQL
# and Tuklas itself is chore/deploy-server-config.

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades

# 2 GB swap file; kept for emergencies, not everyday use (swappiness 10)
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

write_files:
  - path: /etc/sysctl.d/99-tuklas-swap.conf
    content: |
      vm.swappiness=10
      vm.vfs_cache_pressure=50

runcmd:
  - [sysctl, --system]
