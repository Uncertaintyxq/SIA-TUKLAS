# Nginx site for Tuklas. setup-server.sh installs it as /etc/nginx/sites-available/tuklas with
# __DOMAIN__ replaced, then Certbot adds the HTTPS server block and the HTTP-to-HTTPS redirect.
# Laravel sets the security headers (CSP, HSTS, …); Nginx only serves files and passes the rest on.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Only public/ is web-visible: .env, storage/ and vendor/ live outside it
    root /var/www/tuklas/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Uploads are capped at 20 MB by the app; leave room for the form around the file
    client_max_body_size 25M;

    # The built React app: file names carry a content hash, so they can be cached for a year
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Laravel Reverb's WebSocket (live updates). Laravel pushes events to Reverb on 127.0.0.1:8080
    # directly, so Reverb's own HTTP API (/apps/) is not exposed here.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Everything else is Laravel: the API, the app page for every screen's address, and robots.txt and
    # sitemap.xml (SitemapController), which carry the site's own address
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        # The release folder the symlink points at, so a deploy never mixes two releases' files
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file runs, and no dotfile (.env, .git, …) is ever served
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
