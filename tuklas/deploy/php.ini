; PHP settings for Tuklas. setup-server.sh copies this to /etc/php/8.4/fpm/conf.d/99-tuklas.ini
; and /etc/php/8.4/cli/conf.d/99-tuklas.ini.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Uploads are capped at 20 MB by the app (config/tuklas.php)
upload_max_filesize = 21M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60

; Session cookies are Laravel's; PHP's own sessions are unused, but keep them strict anyway
session.use_strict_mode = 1
session.cookie_httponly = 1

; OPcache: compiled code stays in memory. Deploys reload PHP-FPM, which clears it.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
